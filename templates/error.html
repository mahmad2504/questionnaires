{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
  <article class="mx-auto max-w-md rounded-2xl border border-stone-200 bg-white p-6 shadow-sm">
    <h1 class="text-2xl font-semibold tracking-tight text-stone-900">{{ heading }}</h1>
    <p class="mt-2 leading-6 text-stone-600">{{ message }}</p>
    <p class="mt-6">
      <a class="inline-flex items-center justify-center rounded-lg bg-teal-800 px-4 py-2 text-sm font-medium text-white no-underline hover:bg-teal-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-teal-700 focus-visible:ring-offset-2" href="{{ url_for('home') }}">Back to questionnaires</a>
    </p>
  </article>
{% endblock %}
