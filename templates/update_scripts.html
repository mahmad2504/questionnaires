    <script>
      (function () {
        var list = document.getElementById("link-list");
        var addButton = document.getElementById("add-link");
        if (!list || !addButton) return;
        var maxLinks = 20;

        function rows() {
          return list.querySelectorAll("[data-link-row]");
        }

        function sync() {
          var items = rows();
          addButton.disabled = items.length >= maxLinks;
          Array.prototype.forEach.call(items, function (row, index) {
            var input = row.querySelector("input");
            if (input) input.setAttribute("aria-label", "Link " + (index + 1));
          });
        }

        function bind(row) {
          var remove = row.querySelector("[data-remove-link]");
          if (!remove || remove.dataset.bound) return;
          remove.dataset.bound = "1";
          remove.addEventListener("click", function () {
            if (rows().length === 1) {
              var input = row.querySelector("input");
              if (input) input.value = "";
              return;
            }
            row.remove();
            sync();
          });
        }

        addButton.addEventListener("click", function () {
          if (rows().length >= maxLinks) return;
          var row = document.createElement("div");
          row.className = "flex items-center gap-2";
          row.setAttribute("data-link-row", "");
          var input = document.createElement("input");
          input.className = "w-full rounded-md border border-stone-300 bg-white px-3 py-2 text-stone-900 shadow-sm outline-none focus:border-brand focus:ring-2 focus:ring-brand/30";
          input.type = "url";
          input.name = "links";
          input.setAttribute("inputmode", "url");
          input.maxLength = 2000;
          input.placeholder = "https://";
          var remove = document.createElement("button");
          remove.type = "button";
          remove.className = "inline-flex shrink-0 items-center justify-center rounded-md border border-stone-300 bg-white px-3 py-2 text-sm font-medium text-stone-700 hover:bg-stone-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand focus-visible:ring-offset-2";
          remove.textContent = "Remove";
          remove.setAttribute("data-remove-link", "");
          row.append(input, remove);
          list.append(row);
          bind(row);
          sync();
          input.focus();
        });

        Array.prototype.forEach.call(rows(), bind);
        sync();
      })();
    </script>
    {% if image_uploads_enabled %}
    <script>
      (function () {
        var picker = document.getElementById("screenshots");
        var addButton = document.getElementById("add-screenshots");
        var list = document.getElementById("screenshot-list");
        var count = document.getElementById("screenshot-count");
        var message = document.getElementById("screenshot-message");
        var dropZone = document.getElementById("screenshot-field");
        if (!picker || !addButton || !list || !count || !message || !dropZone) return;

        var maxFiles = 8;
        var maxBytes = 8 * 1024 * 1024;
        var typeExt = {
          "image/png": ".png",
          "image/jpeg": ".jpg",
          "image/jpg": ".jpg",
          "image/pjpeg": ".jpg",
          "image/gif": ".gif",
          "image/webp": ".webp"
        };
        var extOk = { ".png": true, ".jpg": true, ".jpeg": true, ".gif": true, ".webp": true };
        var files = [];

        function extensionOf(name) {
          var dot = String(name || "").lastIndexOf(".");
          return dot < 0 ? "" : String(name).slice(dot).toLowerCase();
        }

        function prepared(file) {
          var ext = extensionOf(file.name);
          if (extOk[ext]) return file;
          var mapped = typeExt[file.type];
          if (!mapped) return null;
          var base = String(file.name || "screenshot").replace(/\.[^.]*$/, "").replace(/[^\w.-]+/g, "-") || "screenshot";
          return new File([file], base + mapped, { type: file.type || "", lastModified: file.lastModified });
        }

        function sameFile(left, right) {
          return left.name === right.name && left.size === right.size && left.lastModified === right.lastModified;
        }

        function sync() {
          var transfer = new DataTransfer();
          files.forEach(function (entry) { transfer.items.add(entry.file); });
          picker.files = transfer.files;
        }

        function showError(text) {
          message.textContent = text;
          message.classList.remove("hidden");
        }

        function clearError() {
          message.textContent = "";
          message.classList.add("hidden");
        }

        function render() {
          list.replaceChildren();
          files.forEach(function (entry, index) {
            var item = document.createElement("li");
            item.className = "relative";
            var img = document.createElement("img");
            img.className = "h-28 w-full rounded-md border border-stone-200 bg-white object-cover";
            img.src = entry.url;
            img.alt = entry.file.name;
            var remove = document.createElement("button");
            remove.type = "button";
            remove.className = "absolute right-1.5 top-1.5 rounded-md bg-white/95 px-2 py-0.5 text-xs font-medium text-stone-700 shadow-sm ring-1 ring-stone-200 hover:bg-stone-50";
            remove.textContent = "Remove";
            remove.setAttribute("aria-label", "Remove " + entry.file.name);
            remove.addEventListener("click", function () {
              URL.revokeObjectURL(files[index].url);
              files.splice(index, 1);
              render();
              sync();
              clearError();
            });
            var caption = document.createElement("p");
            caption.className = "mt-1 truncate text-xs text-stone-500";
            caption.textContent = entry.file.name;
            item.append(img, remove, caption);
            list.append(item);
          });
          var total = files.length;
          count.textContent = total === 0 ? "None added" : (total === 1 ? "1 screenshot" : total + " screenshots");
          addButton.disabled = total >= maxFiles;
        }

        function addFiles(incoming) {
          var errors = [];
          Array.prototype.forEach.call(incoming, function (file) {
            var next = prepared(file);
            if (!next) {
              errors.push("Screenshots must be PNG, JPG, GIF, or WebP files.");
              return;
            }
            if (!next.size) {
              errors.push("One of the screenshots is empty.");
              return;
            }
            if (next.size > maxBytes) {
              errors.push("Each screenshot must be 8 MB or smaller.");
              return;
            }
            if (files.length >= maxFiles) {
              errors.push("Attach at most 8 screenshots.");
              return;
            }
            if (files.some(function (entry) { return sameFile(entry.file, next); })) return;
            files.push({ file: next, url: URL.createObjectURL(next) });
          });
          render();
          sync();
          if (errors.length) showError(errors[0]);
          else clearError();
        }

        addButton.addEventListener("click", function () {
          if (files.length >= maxFiles) return;
          picker.click();
        });

        picker.addEventListener("change", function () {
          var selected = Array.prototype.slice.call(picker.files);
          var unchanged = selected.length === files.length && selected.every(function (file, index) {
            return sameFile(file, files[index].file);
          });
          if (unchanged) return;
          addFiles(selected);
        });

        ["dragenter", "dragover"].forEach(function (name) {
          dropZone.addEventListener(name, function (event) {
            if (!event.dataTransfer) return;
            event.preventDefault();
            dropZone.classList.add("border-brand", "bg-brand-soft");
          });
        });
        dropZone.addEventListener("dragleave", function (event) {
          if (dropZone.contains(event.relatedTarget)) return;
          dropZone.classList.remove("border-brand", "bg-brand-soft");
        });
        dropZone.addEventListener("drop", function (event) {
          dropZone.classList.remove("border-brand", "bg-brand-soft");
          if (!event.dataTransfer || !event.dataTransfer.files.length) return;
          event.preventDefault();
          addFiles(event.dataTransfer.files);
        });

        if (picker.form) {
          picker.form.addEventListener("paste", function (event) {
            var items = event.clipboardData && event.clipboardData.items;
            if (!items) return;
            var images = [];
            for (var index = 0; index < items.length; index += 1) {
              if (items[index].kind === "file" && typeExt[items[index].type]) {
                var blob = items[index].getAsFile();
                if (blob) images.push(blob);
              }
            }
            if (!images.length) return;
            event.preventDefault();
            addFiles(images);
          });
        }

        render();
      })();
    </script>
    {% endif %}
