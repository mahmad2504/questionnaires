<div class="overflow-x-auto rounded-2xl border border-stone-200 bg-white shadow-sm">
  <table class="w-full min-w-[56rem] border-collapse text-left text-sm">
    <thead>
      <tr class="border-b border-stone-200 bg-stone-50 text-xs font-medium uppercase tracking-wide text-stone-500">
        <th class="px-3 py-2 font-medium" scope="col">Name</th>
        <th class="px-3 py-2 font-medium" scope="col">Email</th>
        <th class="px-3 py-2 font-medium" scope="col">Submitted</th>
        <th class="px-3 py-2 font-medium" scope="col">Updates</th>
        <th class="px-3 py-2 font-medium" scope="col">Status</th>
        <th class="px-3 py-2 font-medium" scope="col">Updated by</th>
        <th class="px-3 py-2 text-right font-medium" scope="col"><span class="sr-only">Open</span></th>
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
        {% include "review_row.html" %}
      {% endfor %}
    </tbody>
  </table>
</div>
