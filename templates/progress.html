{% set total = progress.expected %}
{% set completed = progress.completed %}
{% set pct = (completed * 100 / total) if total else 0 %}
<div class="mt-3">
  <p class="text-sm text-stone-500">{{ completed }} completed{% for item in progress.statuses %}, {{ item.count }} {{ item.label|lower }}{% endfor %}, {{ progress.waiting }} not submitted</p>
  <div class="mt-2 h-1.5 overflow-hidden rounded-full bg-stone-200" role="progressbar" aria-valuenow="{{ completed }}" aria-valuemin="0" aria-valuemax="{{ total }}" aria-label="{{ completed }} of {{ total }} completed">
    <div class="h-full rounded-full bg-brand" style="width: {{ pct|round(1) }}%"></div>
  </div>
</div>
